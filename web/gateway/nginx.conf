# Граф HomeLab — живой 3D-граф graphify
server {
    listen 8083;
    server_name _;
    root /sites/graph;
    index index.html;

    # graph.json пересобирает служба graphify-watch; браузер сверяется по Last-Modified
    location /data/ {
        alias /sites/graph-data/;
        add_header Cache-Control "no-cache";
    }

    # Стандартная страница graphify
    location = /classic {
        alias /sites/graph-data/graph.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Проверка текста (LanguageTool + формы слов)
server {
    listen 8084;
    server_name _;
    root /sites/textcheck;
    index index.html;

    # Имена контейнеров резолвим при запросе: если textcheck выключен,
    # шлюз всё равно стартует и остальные сайты работают.
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 1m;

    location /api/lt/ {
        set $lt http://languagetool:8010;
        rewrite ^/api/lt/(.*)$ /v2/$1 break;
        proxy_pass $lt;
        proxy_read_timeout 60s;
    }

    location /api/ {
        set $forms http://textcheck-api:8000;
        proxy_pass $forms;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

