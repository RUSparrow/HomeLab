name: web-gateway

services:
  web-gateway:
    image: nginx:alpine
    container_name: websites
    ports:
      - "8080:80"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
    volumes:
      - ../server-monitor/frontend:/sites/server-monitor:ro
      - ../pricefinder/web:/sites/pricefinder:ro
      - ../business-card:/sites/business-card:ro
      - ../textcheck/web:/sites/textcheck:ro
      - ../../graph.html:/usr/share/nginx/html/graph.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - server-monitor
      - price-watcher
      - textcheck
    restart: unless-stopped

networks:
  server-monitor:
    external: true
    name: server-monitor_default
  price-watcher:
    external: true
    name: price-watcher_default
  textcheck:
    external: true
    name: textcheck_default
