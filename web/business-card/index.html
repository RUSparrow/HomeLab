<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visiitkaart</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317181c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fbb26a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <header class="top">
    <div class="wrap top__inner">
      <a class="top__name" href="#" id="top-name"></a>
      <nav class="top__nav" aria-label="Sections">
        <a href="#experience" data-t="nav_experience"></a>
        <a href="#skills" data-t="nav_skills"></a>
        <a href="#contact" data-t="nav_contact"></a>
      </nav>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="et">ET</button>
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero wrap">
      <div class="hero__text">
        <h1 class="hero__name" id="name"></h1>
        <p class="hero__role" id="role"></p>
        <p class="hero__intro" id="intro"></p>
        <div class="hero__actions">
          <a class="btn btn--primary" id="cta-mail" data-t="cta_mail"></a>
          <a class="btn" id="cta-github" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
      </div>

      <figure class="lab" aria-labelledby="lab-title">
        <figcaption class="lab__head">
          <span class="lab__dot" aria-hidden="true"></span>
          <span id="lab-title" data-t="lab_title"></span>
        </figcaption>
        <div class="lab__lanes" id="lab-lanes"></div>
        <p class="lab__note" data-t="lab_note"></p>
      </figure>
    </section>

    <section class="block wrap" id="experience">
      <h2 data-t="nav_experience"></h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section class="block wrap" id="skills">
      <h2 data-t="nav_skills"></h2>
      <div class="skills" id="skill-groups"></div>
    </section>

    <section class="block wrap" id="contact">
      <h2 data-t="nav_contact"></h2>
      <p class="contact__lead" data-t="contact_lead"></p>
      <dl class="contact" id="contact-list"></dl>
    </section>
  </main>

  <footer class="foot wrap">
    <p id="foot"></p>
  </footer>

  <script src="js/main.js?v=2"></script>
</body>
</html>
