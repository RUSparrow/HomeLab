---
# Обновление Docker-образов всех запущенных сервисов.
# Запуск: ansible-playbook update-server.yml -K
# Список проектов — тот же, что у манифеста (group_vars/all.yml): новые сервисы
# добавляются в одном месте.

- name: Update HomeLab containers
  hosts: server
  become: true

  tasks:
    - name: Скачать новые образы
      ansible.builtin.command:
        cmd: docker compose pull --quiet
        chdir: "{{ homelab_path }}/{{ item }}"
      loop: "{{ compose_projects + compose_create_only }}"
      changed_when: false

    - name: Пересобрать свои образы и пересоздать изменившиеся контейнеры
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ homelab_path }}/{{ item }}"
      loop: "{{ compose_projects }}"
      register: compose_up
      changed_when: "'Recreated' in compose_up.stderr or 'Started' in compose_up.stderr"

    - name: ClamAV и Minecraft — только обновить образ, не запускать
      ansible.builtin.command:
        cmd: docker compose create --build
        chdir: "{{ homelab_path }}/{{ item }}"
      loop: "{{ compose_create_only }}"
      changed_when: false

    - name: Удалить старые образы
      ansible.builtin.command: docker image prune -f
      register: prune
      changed_when: "'Total reclaimed space: 0B' not in prune.stdout"
