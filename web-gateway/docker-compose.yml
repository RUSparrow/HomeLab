services:
  web-gateway:
    image: nginx:alpine
    container_name: websites
    ports:
      - "8080:80"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
    volumes:
      - ../server-monitor/frontend:/sites/server-monitor:ro
      - ../price-watcher/web:/sites/pricefinder:ro
      - ../website:/sites/business-card:ro
      - ../graph.html:/usr/share/nginx/html/graph.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - server-monitor
      - price-watcher
    restart: unless-stopped

networks:
  server-monitor:
    external: true
    name: server-monitor_default
  price-watcher:
    external: true
    name: price-watcher_default
