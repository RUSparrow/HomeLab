# Server Monitor
server {
    listen 80;
    server_name _;
    root /sites/server-monitor;
    index index.html;

    location /api/ {
        proxy_pass http://server-monitor:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # С портом (например 192.168.0.176:8080) — панель по нему понимает,
        # через какой веб-вход открыта, и не даст его выключить.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        alias /sites/server-monitor/;
    }

    location = /update-status {
        try_files /update-status.html =404;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

