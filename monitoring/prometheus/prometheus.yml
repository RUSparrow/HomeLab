global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]
    # Прежнее имя цели — чтобы старая история не задваивалась с новой
    relabel_configs:
      - target_label: instance
        replacement: "node-exporter:9100"

  - job_name: "smartctl"
    static_configs:
      - targets: ["smartctl-exporter:9633"]

  - job_name: "fail2ban"
    static_configs:
      - targets: ["fail2ban-exporter:9191"]

  - job_name: "fail2ban-detail"
    static_configs:
      - targets: ["192.168.0.176:9192"]

  # Контейнеры (cAdvisor)
  - job_name: "cadvisor"
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]

  # Панель Server Monitor: состояние сервисов, VPN, ClamAV, Minecraft
  - job_name: "homelab"
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ["server-monitor:8000"]
