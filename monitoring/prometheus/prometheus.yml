global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "smartctl"
    static_configs:
      - targets: ["smartctl-exporter:9633"]

  - job_name: "fail2ban"
    static_configs:
      - targets: ["fail2ban-exporter:9191"]
