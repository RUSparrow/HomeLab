services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./config/config.yml:/etc/loki/config.yml:ro
      - ./data:/loki
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    external: true
