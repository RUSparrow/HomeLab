<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Server Monitor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131720'/%3E%3Cpath d='M6 20l5-6 5 4 5-8 5 6' fill='none' stroke='%233b82f6' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/style.css?v=21">
</head>
<body class="is-loading">
  <div class="dashboard" id="dashboard">
    <header class="header">
      <div class="header__left">
        <h1 class="header__title">Server Monitor</h1>
        <p class="header__host" id="host-name">&nbsp;</p>
      </div>
      <div class="header__right">
        <a class="icon-link" id="pricefinder-link" href="#" title="PriceFinder" aria-label="Открыть PriceFinder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        </a>
        <button class="btn btn--primary" id="update-project" type="button" title="git pull и пересборка панели">Обновить проект</button>
        <div class="conn" id="conn" role="status" aria-live="polite">
          <span class="conn__dot" aria-hidden="true"></span>
          <span class="conn__text" id="conn-text">Подключение…</span>
        </div>
      </div>
    </header>

    <section class="section" aria-labelledby="sys-title">
      <h2 class="section__title" id="sys-title">Система</h2>
      <div class="cards cards--system">
        <article class="card" id="card-cpu">
          <div class="card__head"><span class="card__label">Процессор</span><span class="card__hint">10 мин</span></div>
          <div class="card__value" id="cpu-value">—</div>
          <svg class="spark" id="cpu-spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="bar"><div class="bar__fill" id="cpu-bar"></div></div>
          <p class="card__meta" id="cpu-meta">&nbsp;</p>
        </article>

        <article class="card" id="card-ram">
          <div class="card__head"><span class="card__label">Память</span><span class="card__hint">10 мин</span></div>
          <div class="card__value" id="ram-value">—</div>
          <svg class="spark" id="ram-spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="bar"><div class="bar__fill" id="ram-bar"></div></div>
          <p class="card__meta" id="ram-meta">&nbsp;</p>
        </article>

        <article class="card" id="card-temp">
          <div class="card__head"><span class="card__label">Температура</span><span class="card__hint">10 мин</span></div>
          <div class="card__value" id="temp-value">—</div>
          <svg class="spark" id="temp-spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="bar"><div class="bar__fill" id="temp-bar"></div></div>
          <p class="card__meta" id="temp-meta">&nbsp;</p>
        </article>

        <article class="card" id="card-uptime">
          <div class="card__head"><span class="card__label">Время работы</span></div>
          <div class="card__value" id="uptime-value">—</div>
          <p class="card__meta" id="uptime-meta">&nbsp;</p>
        </article>
      </div>
    </section>

    <section class="section" aria-labelledby="disk-title">
      <h2 class="section__title" id="disk-title">Хранилище</h2>
      <div class="cards cards--disks" id="disks">
        <article class="card card--skeleton"><div class="card__value">—</div></article>
      </div>
    </section>

    <section class="section panel" aria-labelledby="docker-title">
      <div class="panel__head">
        <h2 class="section__title" id="docker-title">Docker</h2>
        <div class="docker-summary" id="docker-summary"></div>
      </div>
      <div class="stack-head" aria-hidden="true">
        <span>Проект</span><span>Контейнеры</span><span>Веб-интерфейс</span><span>Порты</span><span></span>
      </div>
      <div class="stacks" id="stacks">
        <div class="stack stack--skeleton"></div>
        <div class="stack stack--skeleton"></div>
        <div class="stack stack--skeleton"></div>
      </div>
      <p class="panel__error" id="docker-error" hidden></p>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/app.js?v=21"></script>
</body>
</html>
