services:
  server-monitor:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: server-monitor
    ports:
      - "8080:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /mnt/disk1:/mnt/disk1:ro
      - /mnt/disk2:/mnt/disk2:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      - /home/sparrow/HomeLab/vpn/wireguard:/wireguard:ro
      - /usr/bin/wg:/usr/bin/wg:ro
    pid: host
    restart: unless-stopped
    environment:
      SYSFS_PATH: /sys
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
      PLEX_WEB_HOST: host.docker.internal
      PLEX_WEB_PORT: "32400"
      DEPLOY_AGENT_URL: http://deploy-agent:9000
      ROOT_BLOCK_DEVICE: sdc
      STORAGE_DISKS: sda:/mnt/disk1,sdb:/mnt/disk2

  deploy-agent:
    build:
      context: .
      dockerfile: deploy-agent/Dockerfile
    container_name: deploy-agent
    ports:
      - "9000:9000"
    volumes:
      - "/home/sparrow/HomeLab:/home/sparrow/HomeLab"
      - "/home/sparrow/.ssh:/root/.ssh:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      DEPLOY_STATUS_FILE: /home/sparrow/HomeLab/server-monitor/.deploy-status.json
    restart: unless-stopped
