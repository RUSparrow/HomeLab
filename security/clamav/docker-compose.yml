name: clamav

services:
  clamav:
    image: clamav/clamav:stable
    container_name: clamav
    restart: unless-stopped
    volumes:
      - ./database:/var/lib/clamav
      - ./reports:/reports
      - /home/sparrow/HomeLab:/scan/homelab:ro
      - /home/sparrow/Downloads:/scan/downloads:ro
      - /mnt/media:/scan/media:ro
    mem_limit: 4g
    cpus: "1.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
