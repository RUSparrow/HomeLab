services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Tallinn
      - VERSION=docker

    volumes:
      - "/home/sparrow/HomeLab/plex/config/Application Support/Plex Media Server:/config"
      - "/mnt/media:/media"

    restart: unless-stopped
